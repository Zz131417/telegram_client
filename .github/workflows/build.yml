# Build the client on GitHub Actions workers — iOS included, macOS app excluded.
#
# Intent: a standalone macOS .app needs Apple signing, so we deliberately do NOT
# build a macOS desktop app here. iOS is built on a macOS runner (simulator,
# unsigned / debug) so fork owners / users can grab a simulator build.
#
# What this workflow does:
#   - Android  (arm64-v8a / armeabi-v7a / x86_64) -> per-ABI APKs
#   - Linux    (x64 only — Flutter's official Linux SDK is x86-64; arm64 Linux
#               is not published by Flutter, so it cannot be built from the
#               official SDK on CI)                       -> portable tar.gz
#   - Windows  (x64)                               -> zip bundle
#   - iOS      (simulator, debug, unsigned)         -> Runner.app for simulator
#
# Native libtdjson is loaded at *runtime* via dart:ffi and is NOT required to
# compile, so the builds below succeed without placing any native library. Real
# Telegram login only needs libtdjson on the end user's machine (see README).
#
# Secrets: none required. The repo ships a placeholder lib/config/secrets.dart,
# so the built binary compiles and runs but only logs in once you fill real
# api_id / apiHash on your machine.

name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------- Android
  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: android-arm64
          - abi: armeabi-v7a
            target: android-arm
          - abi: x86_64
            target: android-x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform host folders (android/linux/windows)
        run: flutter create --platforms=linux,windows,android .
      - name: Flutter dependencies
        run: flutter pub get
      - name: Build ${{ matrix.abi }} APK
        run: flutter build apk --release --split-per-abi --target-platform ${{ matrix.target }}
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.abi }}
          path: build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk
          if-no-files-found: error

  # ----------------------------------------------------------------- Linux (x64)
  linux:
    name: Linux (x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libopus-dev libpulse0 \
            patchelf xvfb
      - name: Generate platform host folders (android/linux/windows)
        run: flutter create --platforms=linux,windows,android .
      - name: Flutter dependencies
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Package bundle
        run: |
          bundle="build/linux/x64/release/bundle"
          tar -C "$bundle" -czf "telegram_client-linux-x64.tar.gz" .
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: telegram_client-linux-x64.tar.gz
          if-no-files-found: error

  # ----------------------------------------------------------------- Windows
  windows:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform host folders (android/linux/windows)
        shell: bash
        run: flutter create --platforms=linux,windows,android .
      - name: Flutter dependencies
        shell: bash
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Package bundle
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -Destination telegram_client-windows-x64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: telegram_client-windows-x64.zip
          if-no-files-found: error

  # ----------------------------------------------------------------- iOS (simulator, debug, unsigned)
  ios:
    name: iOS (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS host folder
        run: flutter create --platforms=ios .
      - name: Flutter dependencies
        run: flutter pub get
      # Simulator builds only support debug mode (JIT); release/profile are
      # rejected by Flutter for the simulator target. Debug needs no signing.
      - name: Build iOS (simulator, debug, unsigned)
        run: flutter build ios --simulator --debug
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
