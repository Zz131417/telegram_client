# Build the client on GitHub Actions workers.
#
# Targets:
#   - Android  (arm64-v8a / armeabi-v7a / x86_64) -> per-ABI APKs
#   - Linux    (x64 only — Flutter's official Linux SDK is x86-64; arm64 Linux
#               is not published by Flutter, so it cannot be built from the
#               official SDK on CI)                       -> portable tar.gz
#   - Windows  (x64)                               -> zip bundle
#   - iOS      (simulator, debug, unsigned)         -> Runner.app for simulator
#   - iOS IPA  (real device, SIGNED)               -> .ipa   [needs Apple secrets]
#
# The `ios-ipa` job is OPTIONAL: it only runs when the repo (or a fork) has the
# Apple signing secrets configured (APPLE_CERTIFICATE etc.). Without them the
# job is skipped, so the rest of the build is unaffected. Fill those secrets to
# get a real-device .ipa.
#
# Native libtdjson is loaded at *runtime* via dart:ffi and is NOT required to
# compile, so the builds below succeed without placing any native library. Real
# Telegram login only needs libtdjson on the end user's machine (see README).
#
# Secrets: none required for Android/Linux/Windows/iOS-simulator.
#          For ios-ipa: APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD,
#          APPLE_PROVISIONING_PROFILE, APPLE_TEAM_ID (and optionally
#          APPLE_EXPORT_METHOD, default: development).

name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------- Android
  android:
    name: Android (${{ matrix.abi }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: android-arm64
          - abi: armeabi-v7a
            target: android-arm
          - abi: x86_64
            target: android-x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform host folders (android/linux/windows)
        run: flutter create --platforms=linux,windows,android .
      - name: Flutter dependencies
        run: flutter pub get
      - name: Build ${{ matrix.abi }} APK
        run: flutter build apk --release --split-per-abi --target-platform ${{ matrix.target }}
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.abi }}
          path: build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk
          if-no-files-found: error

  # ----------------------------------------------------------------- Linux (x64)
  linux:
    name: Linux (x64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libopus-dev libpulse0 \
            patchelf xvfb
      - name: Generate platform host folders (android/linux/windows)
        run: flutter create --platforms=linux,windows,android .
      - name: Flutter dependencies
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Package bundle
        run: |
          bundle="build/linux/x64/release/bundle"
          tar -C "$bundle" -czf "telegram_client-linux-x64.tar.gz" .
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: telegram_client-linux-x64.tar.gz
          if-no-files-found: error

  # ----------------------------------------------------------------- Windows
  windows:
    name: Windows (x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform host folders (android/linux/windows)
        shell: bash
        run: flutter create --platforms=linux,windows,android .
      - name: Flutter dependencies
        shell: bash
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Package bundle
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -Destination telegram_client-windows-x64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: telegram_client-windows-x64.zip
          if-no-files-found: error

  # ----------------------------------------------------------------- iOS (simulator, debug, unsigned)
  ios:
    name: iOS (simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS host folder
        run: flutter create --platforms=ios .
      - name: Flutter dependencies
        run: flutter pub get
      # Simulator builds only support debug mode (JIT); release/profile are
      # rejected by Flutter for the simulator target. Debug needs no signing.
      - name: Build iOS (simulator, debug, unsigned)
        run: flutter build ios --simulator --debug
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: error

  # ----------------------------------------------------------------- iOS IPA (real device, SIGNED)
  # Only runs when Apple signing secrets are present. Fork owners fill these in
  # repo Settings -> Secrets to produce a real-device .ipa.
  ios-ipa:
    name: iOS IPA (real device)
    runs-on: macos-15
    if: ${{ secrets.APPLE_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS host folder
        run: flutter create --platforms=ios .
      - name: Flutter dependencies
        run: flutter pub get
      - name: Install the Apple certificate and provisioning profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temppass' }}
        run: |
          CERT_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERT_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$P12_PASSWORD" -A -t cert \
            -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles
      - name: Render ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ secrets.APPLE_EXPORT_METHOD || 'development' }}
        run: |
          sed -e "s/__TEAM_ID__/$TEAM_ID/" \
              -e "s/__EXPORT_METHOD__/$EXPORT_METHOD/" \
              ci/ExportOptions.plist > ios/ExportOptions.plist
      - name: Build iOS IPA (signed)
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
