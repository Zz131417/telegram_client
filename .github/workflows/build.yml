# Build the client on GitHub Actions workers.
#
# Triggers:
#   - workflow_dispatch : 手动触发构建；构建完成后自动发布 GitHub Release
#                         （版本默认 0.1.0-r<运行序号>，可在 Run workflow 时覆盖）
#   - schedule (每周一)  : 仅运行 clear-caches，清空所有缓存
#
# Targets (手动构建):
#   - Android  (arm64-v8a / armeabi-v7a / x86_64) -> per-ABI APKs  [bundles libtdjson]
#   - Linux    (x64 only — Flutter's official Linux SDK is x86-64) -> tar.gz [bundles libtdjson]
#   - Windows  (x64)                                   -> zip bundle  [bundles libtdjson]
#   - iOS      (simulator, debug, unsigned)            -> Runner.app
#   - iOS IPA  (real device, UNSIGNED)                 -> .ipa
#   - Wear OS  (arm64)                                -> APK         [bundles libtdjson]
#
# Caching: pub packages (~/.pub-cache via PUB_CACHE) and Gradle (~/.gradle) are
# restored across runs. They are force-cleared every Monday by the clear-caches
# job to avoid stale / bloated caches.
#
# Secrets: none required.

name: Build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建完成后自动发布 GitHub Release'
        type: boolean
        default: true
      version:
        description: 'Release 版本号。留空则按 version.json 自动递增（测试版 0.Y.0-rN）；填 0.1.0 即正式版，填 0.2.0-r0 即下一测试版'
        required: false
        default: ''

permissions:
  contents: read

env:
  PUB_CACHE: ${{ github.workspace }}/.pub-cache

jobs:
  # ----------------------------------------------------------------- Android
  android:
    name: Android (${{ matrix.abi }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64-v8a
            target: android-arm64
          - abi: armeabi-v7a
            target: android-arm
          - abi: x86_64
            target: android-x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Generate platform host folders (android/linux/windows)
        run: flutter create --platforms=linux,windows,android .
      - name: Download libtdjson (Android)
        run: |
          curl -L -o /tmp/jniLibs.tar.gz \
            https://github.com/up9cloud/android-libtdjson/releases/download/v1.8.65/jniLibs.tar.gz
          mkdir -p android/app/src/main
          tar -xzf /tmp/jniLibs.tar.gz -C android/app/src/main/
          # Normalize: some archives ship <abi>/… directly without a jniLibs/ wrapper.
          if [ ! -d android/app/src/main/jniLibs ]; then
            mkdir -p android/app/src/main/jniLibs
            for d in arm64-v8a armeabi-v7a x86 x86_64; do
              [ -d "android/app/src/main/$d" ] && mv "android/app/src/main/$d" android/app/src/main/jniLibs/
            done
          fi
          echo "jniLibs contents:"; ls -R android/app/src/main/jniLibs
      - name: Flutter dependencies
        run: flutter pub get
      - name: Build ${{ matrix.abi }} APK
        run: flutter build apk --release --split-per-abi --target-platform ${{ matrix.target }}
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ matrix.abi }}
          path: build/app/outputs/flutter-apk/app-${{ matrix.abi }}-release.apk
          if-no-files-found: error

  # ----------------------------------------------------------------- Linux (x64)
  linux:
    name: Linux (x64)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev liblzma-dev \
            libsecret-1-dev libjsoncpp-dev libopus-dev libpulse0 \
            patchelf xvfb
      - name: Generate platform host folders (android/linux/windows)
        run: flutter create --platforms=linux,windows,android .
      - name: Flutter dependencies
        run: flutter pub get
      - name: Build Linux
        run: flutter build linux --release
      - name: Download libtdjson (Linux)
        run: |
          # Prebuilt, statically-linked libtdjson from AlexXanderGrib/prebuilt-tdlib (TDLib 1.8.67).
          curl -L -o build/linux/x64/release/bundle/libtdjson.so \
            https://github.com/AlexXanderGrib/prebuilt-tdlib/releases/download/0.1.8.67-42e6a52/libtdjson-x64-glibc.so
      - name: Package bundle
        run: |
          bundle="build/linux/x64/release/bundle"
          tar -C "$bundle" -czf "telegram_client-linux-x64.tar.gz" .
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: telegram_client-linux-x64.tar.gz
          if-no-files-found: error

  # ----------------------------------------------------------------- Windows
  windows:
    name: Windows (x64)
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Generate platform host folders (android/linux/windows)
        shell: bash
        run: flutter create --platforms=linux,windows,android .
      - name: Flutter dependencies
        shell: bash
        run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release
      - name: Download libtdjson (Windows)
        shell: bash
        run: |
          # Prebuilt, statically-linked tdjson from AlexXanderGrib/prebuilt-tdlib (TDLib 1.8.67).
          curl -L -o build/windows/x64/runner/Release/tdjson.dll \
            https://github.com/AlexXanderGrib/prebuilt-tdlib/releases/download/0.1.8.67-42e6a52/tdjson-x64.dll
      - name: Package bundle
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -Destination telegram_client-windows-x64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: telegram_client-windows-x64.zip
          if-no-files-found: error

  # ----------------------------------------------------------------- iOS (simulator, debug, unsigned)
  ios:
    name: iOS (simulator)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Generate iOS host folder
        run: flutter create --platforms=ios .
      - name: Flutter dependencies
        run: flutter pub get
      # Simulator builds only support debug mode (JIT); release/profile are
      # rejected by Flutter for the simulator target. Debug needs no signing.
      - name: Build iOS (simulator, debug, unsigned)
        run: flutter build ios --simulator --debug
      - name: Download & embed libtdjson (iOS simulator)
        run: |
          curl -L --retry 3 -o /tmp/xc.tar.gz \
            https://github.com/up9cloud/ios-libtdjson/releases/download/v1.8.65/libtdjson.xcframework.tar.gz
          rm -rf /tmp/xc && mkdir -p /tmp/xc && tar -xzf /tmp/xc.tar.gz -C /tmp/xc
          DYLIB=$(find /tmp/xc -path '*simulator*/libtdjson.dylib' | head -n 1)
          echo "sim dylib: $DYLIB"
          [ -z "$DYLIB" ] && { echo "sim dylib not found"; exit 1; }
          install_name_tool -id @rpath/libtdjson.dylib "$DYLIB"
          mkdir -p build/ios/iphonesimulator/Runner.app/Frameworks
          cp "$DYLIB" build/ios/iphonesimulator/Runner.app/Frameworks/
          codesign --force --sign - --timestamp=none \
            build/ios/iphonesimulator/Runner.app/Frameworks/libtdjson.dylib
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator
          path: build/ios/iphonesimulator/Runner.app
          if-no-files-found: error

  # ----------------------------------------------------------------- iOS IPA (UNSIGNED)
  ios-ipa:
    name: iOS IPA (unsigned)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Generate iOS host folder
        run: flutter create --platforms=ios .
      - name: Flutter dependencies
        run: flutter pub get
      # Build for device with code signing disabled; produces an unsigned Runner.app.
      - name: Build iOS (device, unsigned)
        run: flutter build ios --release --no-codesign
      - name: Download & embed libtdjson (iOS device)
        run: |
          curl -L --retry 3 -o /tmp/xc.tar.gz \
            https://github.com/up9cloud/ios-libtdjson/releases/download/v1.8.65/libtdjson.xcframework.tar.gz
          rm -rf /tmp/xc && mkdir -p /tmp/xc && tar -xzf /tmp/xc.tar.gz -C /tmp/xc
          DYLIB=$(find /tmp/xc -path '*ios-arm64/libtdjson.dylib' | head -n 1)
          echo "device dylib: $DYLIB"
          [ -z "$DYLIB" ] && { echo "device dylib not found"; exit 1; }
          install_name_tool -id @rpath/libtdjson.dylib "$DYLIB"
          mkdir -p build/ios/iphoneos/Runner.app/Frameworks
          cp "$DYLIB" build/ios/iphoneos/Runner.app/Frameworks/
          # 自包含一份与编译时匹配的 iOS libc++，并把 libtdjson 对系统
          # /usr/lib/libc++.1.dylib 的依赖改指向它，避免新 Xcode 编出的库引用了
          # 旧系统 libc++ 里缺失的符号（__libcpp_verbose_abort）导致运行时 dlopen 失败。
          TOOLCHAIN_LIB="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib/iphoneos"
          SYS_LIBCXX=$(find "$TOOLCHAIN_LIB" -maxdepth 1 \( -name 'libc++.1.dylib' -o -name 'libc++.dylib' \) 2>/dev/null | head -n 1)
          BUNDLED="build/ios/iphoneos/Runner.app/Frameworks/libc++.1.dylib"
          if [ -n "$SYS_LIBCXX" ]; then
            cp "$SYS_LIBCXX" "$BUNDLED"
            install_name_tool -change /usr/lib/libc++.1.dylib @rpath/libc++.1.dylib "$DYLIB"
            codesign --force --sign - --timestamp=none "$BUNDLED"
            echo "已打包自带 libc++: $SYS_LIBCXX"
          else
            echo "警告: 未找到 iOS 真机 libc++.dylib，旧系统可能仍报符号缺失 (__libcpp_verbose_abort)"
          fi
          codesign --force --sign - --timestamp=none \
            build/ios/iphoneos/Runner.app/Frameworks/libtdjson.dylib
      # An .ipa is just a zip with a top-level Payload/ folder containing the .app
      # (which already embeds libtdjson.dylib in Frameworks/).
      - name: Package unsigned .ipa
        run: |
          cd build/ios
          APP_PATH=$(find . -type d -name "Runner.app" | head -n 1)
          if [ -z "$APP_PATH" ]; then echo "Runner.app not found"; exit 1; fi
          rm -rf Payload telegram_client-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -r -9 telegram_client-unsigned.ipa Payload
          mv telegram_client-unsigned.ipa "$GITHUB_WORKSPACE/"
      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa-unsigned
          path: telegram_client-unsigned.ipa
          if-no-files-found: error

  # ----------------------------------------------------------------- Wear OS (arm64)
  wear:
    name: Wear OS (arm64)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ${{ env.PUB_CACHE }}
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-
      - name: Generate Android host
        run: flutter create --platforms=android .
      - name: Configure Wear OS manifest + minSdk
        run: |
          sed -i 's|<application|<uses-feature android:name="android.hardware.type.watch" android:required="false" />\n    <application|' android/app/src/main/AndroidManifest.xml
          sed -i 's|</application>|    <meta-data android:name="com.google.android.wearable.standalone" android:value="true" />\n</application>|' android/app/src/main/AndroidManifest.xml
          sed -i 's/minSdk = 21/minSdk = 30/; s/minSdkVersion 21/minSdkVersion 30/' android/app/build.gradle.kts
      - name: Download libtdjson (Android)
        run: |
          curl -L -o /tmp/jniLibs.tar.gz \
            https://github.com/up9cloud/android-libtdjson/releases/download/v1.8.65/jniLibs.tar.gz
          mkdir -p android/app/src/main
          tar -xzf /tmp/jniLibs.tar.gz -C android/app/src/main/
          if [ ! -d android/app/src/main/jniLibs ]; then
            mkdir -p android/app/src/main/jniLibs
            for d in arm64-v8a armeabi-v7a x86 x86_64; do
              [ -d "android/app/src/main/$d" ] && mv "android/app/src/main/$d" android/app/src/main/jniLibs/
            done
          fi
          echo "jniLibs contents:"; ls -R android/app/src/main/jniLibs
      - name: Flutter dependencies
        run: flutter pub get
      - name: Build Wear OS APK (arm64)
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 -t lib/wear_main.dart
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: wearos-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error

  # ----------------------------------------------------------------- Release (auto)
  # 版本规则（状态存于仓库根 version.json: {"minor":"0.Y.0","r":N}）：
  #   测试版 0.Y.0-rN（prerelease）：每自动构建一次 N+1
  #   正式版 0.Y.0（stable）：发布后下一测试周期重置为 0.(Y+1).0-r0
  # 手动在 Run workflow 填 version 可覆盖（填 0.1.0 即正式版；填 0.2.0-r0 即下一测试版）。
  # 版本号计算后写回 version.json 并推回仓库，保证下次构建继续递增。
  release:
    name: Release
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true'
    needs: [android, linux, windows, ios, ios-ipa, wear]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute & bump version
        id: ver
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.version }}"
          if [ ! -f version.json ]; then
            echo '{"minor":"0.1.0","r":0}' > version.json
          fi
          if [ -n "$INPUT" ]; then
            V="$INPUT"
            if [[ "$V" == *-r* ]]; then
              MINOR="${V%-r*}"; R="${V##*-r}"
              printf '{"minor":"%s","r":%d}\n' "$MINOR" "$((R+1))" > version.json
            else
              IFS='.' read -r A B C <<< "$V"
              printf '{"minor":"%s.%d.0","r":0}\n' "$A" "$((B+1))" > version.json
            fi
          else
            MINOR=$(python3 -c "import json;print(json.load(open('version.json'))['minor'])")
            R=$(python3 -c "import json;print(json.load(open('version.json'))['r'])")
            V="${MINOR}-r${R}"
            printf '{"minor":"%s","r":%d}\n' "$MINOR" "$((R+1))" > version.json
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "$V" == *-r* ]]; then echo "is_prerelease=true" >> "$GITHUB_OUTPUT";
          else echo "is_prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "chore: bump version to ${{ steps.ver.outputs.version }}" || echo "no version change"
          git push || echo "warn: version push skipped"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mkdir -p out
          V="${{ steps.ver.outputs.version }}"
          cp artifacts/android-arm64-v8a/app-arm64-v8a-release.apk out/telegram-client-$V-android-arm64.apk
          cp artifacts/android-armeabi-v7a/app-armeabi-v7a-release.apk out/telegram-client-$V-android-armeabi-v7a.apk
          cp artifacts/android-x86_64/app-x86_64-release.apk out/telegram-client-$V-android-x86_64.apk
          cp artifacts/wearos-arm64/app-arm64-v8a-release.apk out/telegram-client-$V-wearos-arm64.apk
          cp artifacts/linux-x64/telegram_client-linux-x64.tar.gz out/telegram-client-$V-linux-x64.tar.gz
          cp artifacts/windows-x64/telegram_client-windows-x64.zip out/telegram-client-$V-windows-x64.zip
          cp artifacts/ios-ipa-unsigned/telegram_client-unsigned.ipa out/telegram-client-$V-ios-unsigned.ipa
          ( cd artifacts/ios-simulator && zip -r -q ../../out/telegram-client-$V-ios-simulator.zip . )
          ls -la out
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}${{ steps.ver.outputs.is_prerelease == 'true' && ' (测试版)' || '' }}
          prerelease: ${{ steps.ver.outputs.is_prerelease }}
          files: out/*

  # ----------------------------------------------------------------- Clear caches (每周一)
  
