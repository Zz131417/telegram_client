name: telegram_client
description: A beautiful, fluid Telegram client built with Flutter (TDLib).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.5.0
  path_provider: ^2.1.2
  collection: ^1.18.0
  ffi: ^2.1.3
  flutter_qjs_next: ^1.5.1
  qr_flutter: ^4.1.0
  archive: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
