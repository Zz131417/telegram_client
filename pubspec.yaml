name: telegram_client
description: A beautiful, fluid Telegram client built with Flutter (TDLib).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  cupertino_icons: ^1.0.6
  flutter_animate: ^4.5.0
  path_provider: ^2.1.2
  collection: ^1.18.0
  # TDLib Dart bindings with native prebuilt resolution (auto-bundles libtdjson
  # for Android/Linux/Windows/macOS/iOS at build time — no manual lib placement).
  tdlib2: ^1.8.64

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
